# api.ranked.goodvibes.gg — add to csfloat-monitor nginx (NOT csfloat compose services).
# Requires nginx on the goodvibes-ranked Docker network (see docs/docker-api.md).

limit_req_zone $binary_remote_addr zone=ranked_api_limit:10m rate=10r/s;

map $http_origin $ranked_cors_allow_origin {
    default "";
    "https://ranked.goodvibes.gg" $http_origin;
    "http://localhost:3000" $http_origin;
}

server {
    listen 80;
    server_name api.ranked.goodvibes.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ranked.goodvibes.gg;

    ssl_certificate /etc/letsencrypt/live/api.ranked.goodvibes.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ranked.goodvibes.gg/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $ranked_cors_allow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            return 204;
        }

        set $ranked_api_upstream animal_farm_ranked_api:8787;
        proxy_pass http://$ranked_api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        limit_req zone=ranked_api_limit burst=20 nodelay;
    }

    location /health {
        access_log off;
        set $ranked_api_upstream animal_farm_ranked_api:8787;
        proxy_pass http://$ranked_api_upstream/health;
    }
}
